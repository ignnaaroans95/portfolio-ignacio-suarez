    <line x1="298.3" y1="84.3" x2="304" y2="90" stroke="#3c4043" stroke-width="1.8" stroke-linecap="round"/>

    <line x1="15" y1="102" x2="305" y2="102" stroke="#e0e0e0" stroke-width=".8"/>

