    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

    <!--Estilos-->
    <link rel="stylesheet" href="assets/fonts/fontawesome-free-6.1.2-web/css/all.min.css">
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="assets/css/scroll.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
<script src='assets/js/sidebar.js' defer></script>
<script src='assets/js/menu.js' defer></script>
    <script src='assets/js/cv-download.js' defer></script>

</head>

<body>

<a class="skip-link" href="#main-content">Ir al contenido</a>

    <!--Layout principal-->

    <div class="layout">

        <aside data-sidebar data-active="contact"></aside>


        <!--Menu responsive-->

        <div class="layout__menu-toggle" role="button" aria-expanded="false" aria-label="Abrir menú" tabindex="0">

            <i class="menu-toggle__icon fa-solid fa-bars"></i>
            <i class="menu-toggle__icon fa-solid fa-xmark"></i>
            
            </div>
            

        <!--Contenido principal--->

        <main class="layout__content" id="main-content">

          <section class="content__page content__contact">

  <header class="contact__header">
    <h1 class="contact__title" data-animate>Contacto</h1>
  </header>

  <div class="contact__container">

    <!-- Info -->
    <section class="contact__info">

      <div class="contact__data" data-animate data-delay="0">
        <i class="contact__icon fa-solid fa-location-dot"></i>
        <div>
          <p class="contact__label">Ubicación</p>
          <h2 class="contact__subtitle">Torrelodones, Madrid</h2>
        </div>
      </div>

      <div class="contact__data" data-animate data-delay="100">
        <i class="contact__icon fa-solid fa-phone"></i>
        <div>
          <p class="contact__label">Teléfono</p>
          <h2 class="contact__subtitle">+34 684 304 919</h2>
        </div>
      </div>

      <div class="contact__data" data-animate data-delay="200">
        <i class="contact__icon fa-solid fa-envelope"></i>
        <div>
          <p class="contact__label">Email</p>
          <h2 class="contact__subtitle">1995igna@gmail.com</h2>
        </div>
      </div>

      <div class="contact__data" data-animate data-delay="300">
        <i class="contact__icon fa-solid fa-code"></i>
        <div>
          <p class="contact__label">Especialidad</p>
          <h2 class="contact__subtitle">Full Stack Developer</h2>
        </div>
      </div>

    </section>

    <!-- Formulario -->
    <section class="contact__form-box">

      <header class="contact__form-header">
        <h3 class="contact-header__title">¿Cómo puedo <span class="subtitle__color">ayudarte?</span></h3>
      </header>

      <!-- Mapa con bordes difuminados -->
      <div class="contact__map map--feather" id="load-iframe-map">
        <span class="loader"></span>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d12121.087564441075!2d-3.937040316387697!3d40.57975353980123!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd4177c2c48e0265%3A0x8f461cb50b83d086!2s28250%20Torrelodones%2C%20Madrid!5e0!3m2!1ses!2ses!4v1692025257039!5m2!1ses!2ses"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>

      <form class="contact__form" action="https://formspree.io/f/xzdkwakw" method="POST">
        <input type="hidden" name="_replyto" id="hidden-replyto">
        <input type="hidden" name="_subject" value="Nuevo mensaje desde tu portfolio">
        <div class="form__container">

          <section class="form__left">
            <div class="form__group">
              <input type="text" class="form__input" id="contact-name" name="name" required placeholder="Nombre" autocomplete="name">
              <label for="contact-name" class="form__label">Nombre</label>
            </div>

            <div class="form__group">
              <input type="email" class="form__input" id="contact-email" name="email" required placeholder="Email" autocomplete="email">
              <label for="contact-email" class="form__label">Email</label>
            </div>

            <div class="form__group">
              <input type="text" class="form__input" id="contact-subject" name="subject" required placeholder="Asunto">
              <label for="contact-subject" class="form__label">Asunto</label>
            </div>
          </section>

          <section class="form__right">
            <div class="form__group form__group--textarea">
              <textarea class="form__input form__input--textarea" id="contact-message" name="message" required placeholder="Mensaje"></textarea>
              <label for="contact-message" class="form__label">Mensaje</label>
            </div>
          </section>

        </div>
        <button type="submit" class="form__button">Enviar Mensaje</button>
      </form>

      <!-- Toast notification -->
      <div class="form__toast" id="formToast" role="status" aria-live="polite"></div>



    </section>
  </div>
</section>





    </main>




    </div>
<a class="fab fab--wa"

   target="_blank" rel="noopener"
   aria-label="Escríbeme por WhatsApp">
  <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
</a>
</body>

</html>
