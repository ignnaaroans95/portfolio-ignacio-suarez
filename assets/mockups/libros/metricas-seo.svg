<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8a77b" stop-opacity=".32"/>
      <stop offset="100%" stop-color="#c8a77b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="320" rx="14" fill="#0f172a"/>

  <!-- Chrome bar -->
  <rect x="0" y="0" width="600" height="46" rx="14" fill="#1e293b"/>
  <rect x="0" y="33" width="600" height="13" fill="#1e293b"/>

  <!-- Window dots -->
  <circle cx="22" cy="23" r="5.5" fill="#ef4444" opacity=".85"/>
  <circle cx="39" cy="23" r="5.5" fill="#f59e0b" opacity=".85"/>
  <circle cx="56" cy="23" r="5.5" fill="#22c55e" opacity=".85"/>

  <!-- URL bar -->
  <rect x="74" y="12" width="452" height="22" rx="11" fill="#0f172a"/>
  <text x="300" y="27" text-anchor="middle" font-size="10" fill="#475569">search.google.com/search-console · libreos.app · últimos 6 meses</text>

  <!-- Section label -->
  <text x="18" y="66" font-size="10.5" fill="#94a3b8" font-weight="600" letter-spacing=".06em">RENDIMIENTO ORGÁNICO</text>
  <rect x="476" y="55" width="106" height="18" rx="9" fill="#14532d" opacity=".7"/>
  <text x="529" y="67.5" text-anchor="middle" font-size="9.5" fill="#4ade80" font-weight="600">↑ +340 % YTD</text>

  <!-- Stat card 1 -->
  <rect x="18" y="76" width="174" height="74" rx="9" fill="#1e293b"/>
  <text x="30" y="97" font-size="9.5" fill="#64748b" letter-spacing=".03em">PÁGINAS INDEXADAS</text>
  <text x="30" y="126" font-size="28" font-weight="700" fill="#c8a77b">10.247</text>
  <rect x="30" y="137" width="144" height="4" rx="2" fill="#0f172a"/>
  <rect x="30" y="137" width="110" height="4" rx="2" fill="url(#barGreen)"/>

  <!-- Stat card 2 -->
  <rect x="204" y="76" width="174" height="74" rx="9" fill="#1e293b"/>
  <text x="216" y="97" font-size="9.5" fill="#64748b" letter-spacing=".03em">PRE-RENDERIZADAS</text>
  <text x="216" y="126" font-size="28" font-weight="700" fill="#c8a77b">250+</text>
  <text x="216" y="140" font-size="9" fill="#7b5b3f" opacity=".9">listas · rutas · libros</text>

  <!-- Stat card 3 -->
  <rect x="390" y="76" width="192" height="74" rx="9" fill="#1e293b"/>
  <text x="402" y="97" font-size="9.5" fill="#64748b" letter-spacing=".03em">ÍNDICE LOCAL</text>
  <text x="402" y="126" font-size="28" font-weight="700" fill="#c8a77b">13.8 MB</text>
  <text x="402" y="140" font-size="9" fill="#6366f1">10 K+ libros · sin round-trip</text>

  <!-- Chart container -->
  <rect x="18" y="162" width="564" height="142" rx="9" fill="#1e293b"/>
  <text x="32" y="182" font-size="10.5" fill="#94a3b8" font-weight="500">Clics orgánicos · 2025</text>

  <!-- Grid lines horizontal -->
  <line x1="32" y1="282" x2="568" y2="282" stroke="#334155" stroke-width="1"/>
  <line x1="32" y1="256" x2="568" y2="256" stroke="#334155" stroke-width=".6" stroke-dasharray="4 3"/>
  <line x1="32" y1="230" x2="568" y2="230" stroke="#334155" stroke-width=".6" stroke-dasharray="4 3"/>
  <line x1="32" y1="204" x2="568" y2="204" stroke="#334155" stroke-width=".6" stroke-dasharray="4 3"/>

  <!-- Area fill -->
  <polygon points="32,278 95,274 165,266 240,255 315,242 390,226 450,212 510,196 568,186 568,282 32,282" fill="url(#area)"/>

  <!-- Chart line -->
  <polyline
    points="32,278 95,274 165,266 240,255 315,242 390,226 450,212 510,196 568,186"
    stroke="#c8a77b" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Last dot glow -->
  <circle cx="568" cy="186" r="9" fill="#c8a77b" opacity=".18"/>
  <circle cx="568" cy="186" r="5" fill="#c8a77b"/>

  <!-- Month labels -->
  <text x="32"  y="298" font-size="9" fill="#475569">Ene</text>
  <text x="100" y="298" font-size="9" fill="#475569">Feb</text>
  <text x="175" y="298" font-size="9" fill="#475569">Mar</text>
  <text x="248" y="298" font-size="9" fill="#475569">Abr</text>
  <text x="322" y="298" font-size="9" fill="#475569">May</text>
  <text x="396" y="298" font-size="9" fill="#475569">Jun</text>
  <text x="455" y="298" font-size="9" fill="#475569">Jul</text>
  <text x="513" y="298" font-size="9" fill="#475569">Ago</text>
</svg>
