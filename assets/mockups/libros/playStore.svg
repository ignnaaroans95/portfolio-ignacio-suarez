    <text x="52"  y="488" text-anchor="middle" font-size="9.5" fill="#1b5e20">Libros</text>
    <rect x="90"  y="474" width="78" height="20" rx="10" fill="#e8f0fe"/>
    <text x="129" y="488" text-anchor="middle" font-size="9.5" fill="#1a73e8">Educación</text>
    <rect x="176" y="474" width="46" height="20" rx="10" fill="#fce8e6"/>
    <text x="199" y="488" text-anchor="middle" font-size="9.5" fill="#c5221f">IA</text>

