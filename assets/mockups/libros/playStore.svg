    <text x="22" y="420" font-size="12" font-weight="600" fill="#202124">Sobre esta app</text>
    <text x="22" y="436" font-size="10.5" fill="#5f6368">Descubre tu próxima lectura por</text>
    <text x="22" y="450" font-size="10.5" fill="#5f6368">estado de ánimo. Chat con LibrAI,</text>
    <text x="22" y="464" font-size="10.5" fill="#5f6368">lee 132+ clásicos. Freemium.</text>

