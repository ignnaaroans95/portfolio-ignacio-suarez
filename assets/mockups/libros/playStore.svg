<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 520" width="320" height="520" font-family="system-ui,-apple-system,BlinkMacSystemFont,sans-serif">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7b5b3f"/>
      <stop offset="100%" stop-color="#c8a77b"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="15" y="34" width="290" height="452" rx="22"/>
    </clipPath>
  </defs>

  <!-- Phone body -->
  <rect x="0" y="0" width="320" height="520" rx="46" fill="#1c1c1e"/>
  <rect x="2" y="2" width="316" height="516" rx="44" fill="#2c2c2e"/>

  <!-- Side buttons -->
  <rect x="-3" y="118" width="5" height="38" rx="2.5" fill="#3a3a3c"/>
  <rect x="-3" y="166" width="5" height="38" rx="2.5" fill="#3a3a3c"/>
  <rect x="318" y="128" width="5" height="58" rx="2.5" fill="#3a3a3c"/>

  <!-- Camera / notch area -->
  <rect x="120" y="12" width="80" height="18" rx="9" fill="#1c1c1e"/>
  <circle cx="160" cy="21" r="4.5" fill="#0e0e10"/>
  <circle cx="160" cy="21" r="2" fill="#1a1a1c"/>

  <!-- Screen background -->
  <rect x="15" y="34" width="290" height="452" rx="22" fill="#ffffff"/>

