    <rect x="112" y="301" width="22" height="3" rx="1.5" fill="#c8a77b" opacity=".4"/>
    <rect x="126" y="313" width="46" height="16" rx="5" fill="#7b5b3f" opacity=".85"/>
    <rect x="130" y="317" width="30" height="3" rx="1.5" fill="#fff" opacity=".72"/>
    <rect x="130" y="323" width="22" height="3" rx="1.5" fill="#fff" opacity=".5"/>
    <rect x="108" y="334" width="46" height="16" rx="5" fill="#1e293b" stroke="#c8a77b" stroke-width=".6"/>
