    <rect x="36" y="125" width="18" height="24" rx="3" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>
    <rect x="47" y="125" width="18" height="24" rx="3" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/>
