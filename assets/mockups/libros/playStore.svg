    <rect x="190" y="298" width="62" height="3" rx="1.5" fill="#7b5b3f" opacity=".25"/>
    <rect x="190" y="304" width="56" height="3" rx="1.5" fill="#7b5b3f" opacity=".25"/>
    <rect x="190" y="310" width="62" height="3" rx="1.5" fill="#7b5b3f" opacity=".22"/>
    <rect x="190" y="316" width="50" height="3" rx="1.5" fill="#7b5b3f" opacity=".22"/>
    <rect x="190" y="322" width="62" height="3" rx="1.5" fill="#7b5b3f" opacity=".2"/>
    <rect x="190" y="332" width="62" height="3" rx="1.5" fill="#7b5b3f" opacity=".18"/>
    <rect x="190" y="338" width="54" height="3" rx="1.5" fill="#7b5b3f" opacity=".18"/>
